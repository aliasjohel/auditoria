<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Control</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
</head>
<body>

  <div class="navbar">
    <h2>Central de Control</h2>
    <div class="nav-actions">
      <button onclick="goTo('home.html')" class="back-btn">Volver</button>
      <button onclick="logout()" class="logout">Cerrar sesión</button>
    </div>
  </div>

  <div class="page">
    <div class="card page-card">
      <h3>Importar conteos de equipos</h3>

      <input type="file" id="teamCountFileInput" accept=".json" multiple>
      <button id="importTeamCountsBtn" type="button">Importar archivos</button>
      <button id="clearCentralBtn" type="button" class="danger-btn">
  Limpiar central
</button>

      <p id="centralMsg" class="info-msg"></p>
      <div id="centralSummary" class="products-list"></div>
      <hr style="margin:30px 0;">

<h3>Resumen automático</h3>
<input
  type="text"
  id="centralSearch"
  placeholder="Buscar por nombre o código..."
>

<div class="summary-grid">

  <div class="summary-card">
    <strong>Productos con faltantes</strong>
    <h2 id="faltantesCount">0</h2>
  </div>

  <div class="summary-card">
    <strong>Unidades faltantes</strong>
    <h2 id="faltantesUnits">0</h2>
  </div>

  <div class="summary-card">
    <strong>Productos con sobrantes</strong>
    <h2 id="sobrantesCount">0</h2>
  </div>

  <div class="summary-card">
    <strong>Unidades sobrantes</strong>
    <h2 id="sobrantesUnits">0</h2>
  </div>

</div>

<div class="central-columns">
  <div>
    <h3>Correctos</h3>
    <div id="correctosList" class="products-list"></div>
  </div>

  <div>
    <h3>Faltantes</h3>
    <div id="faltantesList" class="products-list"></div>
  </div>

  <div>
    <h3>Sobrantes</h3>
    <div id="sobrantesList" class="products-list"></div>
  </div>
</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
